<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helix Research — Clinical Trial Screening</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f5f6f8; color: #202832; line-height: 1.5; }
    .page { max-width: 700px; margin: 0 auto; padding: 34px 20px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #5b6470; margin: 0 0 22px; }
    form { background: #fff; border: 1px solid #d5dbe2; border-radius: 8px; padding: 26px; }
    fieldset { border: none; margin: 0 0 18px; padding: 0; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .row fieldset { flex: 1 1 200px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #c9d0da; border-radius: 6px; font-size: 15px; font-family: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    button { padding: 12px 26px; font-size: 15px; color: #fff; background: #2b4a7a; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Helix Research Institute</h1>
    <p class="sub">Confidential clinical trial screening questionnaire.</p>
    <form id="screening-form" novalidate>
      <fieldset>
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" name="full_name" autocomplete="name">
      </fieldset>
      <div class="row">
        <fieldset>
          <label for="dob">Date of birth</label>
          <input type="date" id="dob" name="dob" autocomplete="bday">
        </fieldset>
        <fieldset>
          <label for="ec-phone">Emergency contact number</label>
          <input type="tel" id="ec-phone" name="ec_phone">
        </fieldset>
      </div>
      <fieldset>
        <label for="emergency">Emergency contact</label>
        <input type="text" id="emergency" name="emergency" placeholder="Name and relationship">
      </fieldset>
      <fieldset>
        <label for="history">Relevant medical history</label>
        <textarea id="history" name="history"></textarea>
      </fieldset>
      <fieldset>
        <label for="medications">Current medications</label>
        <input type="text" id="medications" name="medications">
      </fieldset>
      <button type="submit">Submit screening</button>
    </form>
  </div>
</body>
</html>
