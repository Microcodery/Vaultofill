<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlowDesk — Start your free trial</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; background: linear-gradient(160deg,#eef2ff,#ffffff); color: #1c2333; line-height: 1.5; }
    .card { max-width: 460px; margin: 48px auto; background: #fff; border: 1px solid #e0e5f2; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(40,60,120,.08); }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #6a7488; margin: 0 0 22px; font-size: 14px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
    input, select { width: 100%; padding: 11px 12px; border: 1px solid #d3d9e6; border-radius: 9px; font-size: 15px; }
    button { width: 100%; margin-top: 6px; padding: 12px; font-size: 16px; font-weight: 700; color: #fff; background: #4f46e5; border: none; border-radius: 9px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Start your free trial</h1>
    <p class="sub">14 days of FlowDesk, no credit card required.</p>
    <form id="trial-form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name">
      </div>
      <div class="field">
        <label for="work-email">Work email</label>
        <input type="email" id="work-email" name="work_email">
      </div>
      <div class="field">
        <label for="company">Company name</label>
        <input type="text" id="company" name="company" autocomplete="organization">
      </div>
      <div class="field">
        <label for="team-size">Team size</label>
        <input type="number" id="team-size" name="team_size" min="1" step="1">
      </div>
      <div class="field">
        <label for="title">Job title</label>
        <input type="text" id="title" name="title" autocomplete="organization-title">
      </div>
      <div class="field">
        <label for="referral">How did you hear about us?</label>
        <select id="referral" name="referral">
          <option value="">Select…</option>
          <option value="search">Search engine</option>
          <option value="social">Social media</option>
          <option value="friend">Friend or colleague</option>
          <option value="ad">Advertisement</option>
        </select>
      </div>
      <button type="submit">Create account</button>
    </form>
  </div>
</body>
</html>
