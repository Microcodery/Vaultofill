<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fireside Grill — Build Your Order</title>
  <style>
    :root {
      --brand: #c0392b;
      --brand-dark: #8e2a1e;
      --accent: #f39c12;
      --ink: #2b1d18;
      --muted: #7a6a63;
      --line: #e6ddd8;
      --bg: #fff8f4;
      --ok: #1e824c;
      --bad: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.45;
    }
    header.brand {
      background: linear-gradient(120deg, var(--brand), var(--brand-dark));
      color: #fff;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header.brand .logo {
      font-size: 30px;
      line-height: 1;
    }
    header.brand h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
    header.brand p { margin: 2px 0 0; opacity: .85; font-size: 13px; }
    main {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px 48px;
    }
    form {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 6px 24px rgba(120,60,40,.06);
    }
    fieldset {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin: 0 0 18px;
      padding: 14px 16px 16px;
    }
    legend {
      font-weight: 700;
      padding: 0 8px;
      color: var(--brand-dark);
    }
    .field { margin-bottom: 14px; }
    label.field-label { display: block; font-weight: 600; margin-bottom: 6px; }
    .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
    input[type="text"], input[type="tel"], input[type="number"], textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: #fffdfc;
    }
    input[type="number"] { max-width: 140px; }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* VISUAL-REORDER: radio option renders with label AFTER the input via row-reverse.
       Size options use CSS order to visually reverse their sequence. */
    .optgroup { display: flex; flex-wrap: wrap; gap: 10px; }
    .opt {
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 14px;
      background: #fffdfc;
      cursor: pointer;
    }
    .opt input { margin: 0; }
    .opt:hover { border-color: var(--accent); }
    .size-group .opt:nth-child(1) { order: 3; }
    .size-group .opt:nth-child(2) { order: 2; }
    .size-group .opt:nth-child(3) { order: 1; }

    .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .check {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: #fffdfc;
    }
    .check label { flex: 1; }

    button[type="submit"] {
      background: var(--brand);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--brand-dark); }

    .error-msg { color: var(--bad); font-size: 12px; margin-top: 4px; min-height: 0; }
    .field-error input,
    .field-error textarea { border-color: var(--bad); background: #fdecea; }
    .field-error > .optgroup .opt,
    .field-error > .checks .check { border-color: var(--bad); }
    .field-error > .field-label { color: var(--bad); }

    .result { margin-top: 18px; padding: 14px 16px; border-radius: 10px; font-weight: 600; }
    .result.pass { background: #e8f6ee; color: var(--ok); border: 1px solid #b7e4c7; }
    .result.fail { background: #fdecea; color: var(--bad); border: 1px solid #f5c6c0; }
    .result h2 { margin: 0 0 6px; font-size: 16px; }
    .result ul { margin: 6px 0 0 18px; padding: 0; }
    #delivery-address-field[hidden] { display: none; }
  </style>
</head>
<body>
  <header class="brand">
    <div class="logo" aria-hidden="true">🔥</div>
    <div>
      <h1>Fireside Grill</h1>
      <p>Flame-cooked favorites, delivered hot.</p>
    </div>
  </header>

  <main>
    <form id="order-form" novalidate>
      <fieldset>
        <legend>Choose your item</legend>
        <div class="field" id="item-field">
          <span class="field-label">Item</span>
          <div class="optgroup" role="radiogroup" aria-label="Item">
            <label class="opt"><span>Flame Burger</span><input type="radio" name="item" id="item-burger" value="burger"></label>
            <label class="opt"><span>Wood-Fired Pizza</span><input type="radio" name="item" id="item-pizza" value="pizza"></label>
            <label class="opt"><span>Garden Salad</span><input type="radio" name="item" id="item-salad" value="salad"></label>
          </div>
          <div class="error-msg" id="item-error"></div>
        </div>

        <div class="field" id="size-field">
          <span class="field-label">Size <span class="hint">(labels shown large→small)</span></span>
          <div class="optgroup size-group" role="radiogroup" aria-label="Size">
            <label class="opt"><span>Small</span><input type="radio" name="size" id="size-s" value="S"></label>
            <label class="opt"><span>Medium</span><input type="radio" name="size" id="size-m" value="M"></label>
            <label class="opt"><span>Large</span><input type="radio" name="size" id="size-l" value="L"></label>
          </div>
          <div class="error-msg" id="size-error"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Add-ons &amp; options</legend>
        <div class="field" id="addons-field">
          <span class="field-label">Add-ons <span class="hint">(optional, choose any)</span></span>
          <div class="checks">
            <div class="check"><label for="addon-cheese">Extra Cheese</label><input type="checkbox" name="addons" id="addon-cheese" value="cheese"></div>
            <div class="check"><label for="addon-bacon">Bacon</label><input type="checkbox" name="addons" id="addon-bacon" value="bacon"></div>
            <div class="check"><label for="addon-avocado">Avocado</label><input type="checkbox" name="addons" id="addon-avocado" value="avocado"></div>
            <div class="check"><label for="addon-jalapeno">Jalapeño</label><input type="checkbox" name="addons" id="addon-jalapeno" value="jalapeno"></div>
            <div class="check"><label for="addon-mushroom">Mushrooms</label><input type="checkbox" name="addons" id="addon-mushroom" value="mushroom"></div>
          </div>
        </div>

        <div class="field" id="quantity-field">
          <label class="field-label" for="quantity">Quantity <span class="hint">(1–20)</span></label>
          <input type="number" name="quantity" id="quantity" min="1" max="20" step="1" value="1">
          <div class="error-msg" id="quantity-error"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Fulfillment</legend>
        <div class="field" id="method-field">
          <span class="field-label">How would you like it?</span>
          <div class="optgroup" role="radiogroup" aria-label="Fulfillment method">
            <label class="opt"><span>Delivery</span><input type="radio" name="method" id="method-delivery" value="delivery"></label>
            <label class="opt"><span>Pickup</span><input type="radio" name="method" id="method-pickup" value="pickup"></label>
          </div>
          <div class="error-msg" id="method-error"></div>
        </div>

        <div class="field" id="delivery-address-field" hidden>
          <label class="field-label" for="delivery-address">Delivery address <span class="hint">(required for delivery)</span></label>
          <input type="text" name="delivery_address" id="delivery-address" autocomplete="street-address">
          <div class="error-msg" id="delivery-address-error"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Contact</legend>
        <div class="field" id="customer-name-field">
          <label class="field-label" for="customer-name">Name</label>
          <input type="text" name="customer_name" id="customer-name" autocomplete="name">
          <div class="error-msg" id="customer-name-error"></div>
        </div>
        <div class="field" id="phone-field">
          <label class="field-label" for="phone">Phone</label>
          <input type="tel" name="phone" id="phone" autocomplete="tel" placeholder="(555) 123-4567">
          <div class="error-msg" id="phone-error"></div>
        </div>
        <div class="field" id="notes-field">
          <label class="field-label" for="order-notes">Order notes <span class="hint">(optional)</span></label>
          <textarea name="order_notes" id="order-notes" placeholder="Allergies, gate code, etc."></textarea>
        </div>
      </fieldset>

      <button type="submit">Place Order</button>
      <div id="result" class="result" role="status" aria-live="polite" hidden></div>
    </form>
  </main>

  <script>
    (function () {
      var form = document.getElementById('order-form');
      var result = document.getElementById('result');
      var methodRadios = form.querySelectorAll('input[name="method"]');
      var addressField = document.getElementById('delivery-address-field');

      function isDelivery() {
        var r = form.querySelector('input[name="method"]:checked');
        return r && r.value === 'delivery';
      }
      function syncAddress() {
        addressField.hidden = !isDelivery();
      }
      methodRadios.forEach(function (r) { r.addEventListener('change', syncAddress); });
      syncAddress();

      function setError(fieldId, message, failures) {
        var field = document.getElementById(fieldId + '-field');
        if (field) field.classList.add('field-error');
        var msg = document.getElementById(fieldId + '-error');
        if (msg) msg.textContent = message;
        failures.push({ fieldId: fieldId, message: message });
      }
      function clearErrors() {
        form.querySelectorAll('.field-error').forEach(function (el) { el.classList.remove('field-error'); });
        form.querySelectorAll('.error-msg').forEach(function (el) { el.textContent = ''; });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        clearErrors();
        var failures = [];

        if (!form.querySelector('input[name="item"]:checked'))
          setError('item', 'Please select an item.', failures);

        if (!form.querySelector('input[name="size"]:checked'))
          setError('size', 'Please choose a size.', failures);

        var qty = parseInt(document.getElementById('quantity').value, 10);
        if (isNaN(qty) || qty < 1 || qty > 20)
          setError('quantity', 'Quantity must be between 1 and 20.', failures);

        if (!form.querySelector('input[name="method"]:checked'))
          setError('method', 'Please choose delivery or pickup.', failures);

        if (isDelivery()) {
          var addr = document.getElementById('delivery-address').value.trim();
          if (!addr) setError('delivery-address', 'Delivery address is required for delivery.', failures);
        }

        var name = document.getElementById('customer-name').value.trim();
        if (!name) setError('customer-name', 'Name is required.', failures);

        var phoneRaw = document.getElementById('phone').value;
        var digits = phoneRaw.replace(/\D/g, '');
        if (!phoneRaw.trim()) setError('phone', 'Phone is required.', failures);
        else if (digits.length < 10) setError('phone', 'Enter a valid phone number (at least 10 digits).', failures);

        if (failures.length) {
          result.className = 'result fail';
          result.innerHTML = '<h2>✗ Submission failed — ' + failures.length + ' issue(s)</h2><ul>' +
            failures.map(function (f) { return '<li>' + f.message + '</li>'; }).join('') + '</ul>';
        } else {
          result.className = 'result pass';
          result.textContent = '✓ Submission passed — all fields valid.';
        }
        result.hidden = false;
        result.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    })();
  </script>
</body>
</html>
