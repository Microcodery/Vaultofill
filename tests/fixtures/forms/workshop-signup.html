<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pottery Workshop — Signup</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Century Gothic", "Segoe UI", sans-serif; background: #fbf7f0; color: #33291d; line-height: 1.5; }
    .wrap { max-width: 540px; margin: 0 auto; padding: 40px 22px 60px; }
    h1 { font-size: 23px; margin: 0 0 6px; }
    .sub { color: #7a6d5a; margin: 0 0 24px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #d8cbb6; border-radius: 8px; font-size: 15px; }
    button { padding: 12px 26px; font-size: 15px; color: #fff; background: #a9662b; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Hands-on Pottery Workshop</h1>
    <p class="sub">A relaxed evening at the wheel — beginners welcome.</p>
    <form id="workshop-form" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" name="full_name" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="allergies">Any allergies or dietary needs?</label>
        <input type="text" id="allergies" name="allergies">
      </div>
      <div class="field">
        <label for="shirt">T-shirt size</label>
        <select id="shirt" name="shirt">
          <option value="">Select a size…</option>
          <option value="xs">XS</option>
          <option value="s">S</option>
          <option value="m">M</option>
          <option value="l">L</option>
          <option value="xl">XL</option>
        </select>
      </div>
      <div class="field">
        <label for="level">Experience level</label>
        <select id="level" name="level">
          <option value="">Select…</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
      <button type="submit">Sign up</button>
    </form>
  </div>
</body>
</html>
