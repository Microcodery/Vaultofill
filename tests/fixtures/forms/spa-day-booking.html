<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotus Spa — Day Booking</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Georgia", serif; background: #f7f2f6; color: #3a2b38; line-height: 1.55; }
    .card { max-width: 560px; margin: 44px auto; background: #fff; border: 1px solid #e6d7e2; border-radius: 14px; padding: 30px; }
    h1 { font-size: 24px; margin: 0 0 4px; color: #8e4a75; }
    .sub { color: #7a6a75; margin: 0 0 22px; font-size: 14px; font-family: Arial, sans-serif; }
    .field { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddc9d6; border-radius: 8px; font-size: 15px; font-family: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    button { padding: 12px 26px; font-size: 15px; color: #fff; background: #8e4a75; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lotus Spa &amp; Wellness</h1>
    <p class="sub">Book your day of relaxation.</p>
    <form id="spa-form" novalidate>
      <div class="field">
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" name="full_name" autocomplete="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel">
      </div>
      <div class="field">
        <label for="appt-date">Appointment date</label>
        <input type="date" id="appt-date" name="appt_date">
      </div>
      <div class="field">
        <label for="appt-time">Preferred time</label>
        <input type="time" id="appt-time" name="appt_time">
      </div>
      <div class="field">
        <label for="treatment">Treatment</label>
        <select id="treatment" name="treatment">
          <option value="">Choose a treatment…</option>
          <option value="massage">Massage</option>
          <option value="facial">Facial</option>
          <option value="mani-pedi">Mani-pedi</option>
        </select>
      </div>
      <div class="field">
        <label for="requests">Special requests</label>
        <textarea id="requests" name="requests"></textarea>
      </div>
      <button type="submit">Book appointment</button>
    </form>
  </div>
</body>
</html>
